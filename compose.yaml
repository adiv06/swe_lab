services:
  backend:
    build: .
    environment:
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env to your Atlas connection string}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-swe_lab}
      MONGODB_COLLECTION: ${MONGODB_COLLECTION:-items}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
